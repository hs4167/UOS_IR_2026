# 위치 추정 (nav2_amcl, ROS 2 Foxy) + 지도 서버 설정. launch/localization.launch.py가 읽는다.
# 기준·정찰 주행 녹화 때 사진마다 지도 좌표 위치(map → base_footprint)를 붙이려고 쓴다.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: differential
    tf_broadcast: true
    transform_tolerance: 0.5
    # 레이저 모델
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: -1.0          # -1 = LiDAR가 알려주는 최대 거리 사용
    laser_min_range: -1.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    # 입자 필터
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # 오도메트리 잡음 (TurtleBot3 공식 설정과 같은 0.2)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # 갱신 조건: 공식값(0.25 m)보다 자주 갱신해 사진마다 위치가 덜 밀리게
    update_min_d: 0.05
    update_min_a: 0.1
    save_pose_rate: 0.5
    # 시작 위치 (localize.sh --x --y --yaw 로 덮어씀). SLAM을 시작한 자리에 두면 (0, 0, 0)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""              # launch에서 지정
