# 청소 구역 탐지기 파라미터. 코드에 값을 박지 말고 여기서 바꾼다.
# 단위: 길이 m, 시간 s (따로 적은 경우 제외)

roi:                      # base_footprint 기준 근거리 관심 영역 (x 전방, y 왼쪽)
  x_min: 0.15
  x_max: 0.60
  y_min: -0.25
  y_max: 0.25

grid:
  resolution: 0.01        # 바닥 격자 해상도 (LiDAR 지도는 0.05)
  supersample: 4          # 칸 하나를 4x4 점으로 읽어 평균 (가는 이음새의 계단 현상 방지)

calibration:              # [0] 카메라 보정 · 바닥 투영
  pattern: [9, 6]         # 체커보드 내부 코너 개수 (가로, 세로). 칸 개수보다 1씩 작다
  square: 0.025           # 칸 한 변 [m]. 인쇄 후 자로 잰 값으로 바꿀 것
  floor_pass_mean: 0.01   # 투영 오차 평균 통과 기준 [m]
  floor_min_marks: 5      # 통과 판정에 필요한 ROI 안 확인점 최소 개수

reference:                # [2] 기준 바닥 격자
  min_count: 3            # 이 횟수 이상 본 칸만 기준으로 인정 (적으면 "확인 불가")
  coverage_warn: 0.9      # 바닥 칸 중 기준 있는 비율이 이보다 낮으면 재주행 권고

compare:
  method: delta_e         # sad_gray(기준선, 밝기만) | delta_e(밝기+색) | chroma_diff(색만)
  offset_correction: true # 창마다 밝기 차이 중앙값을 빼서 조명 변화 상쇄 (sad_gray, delta_e)
  neighborhood: 1         # 주변 (2r+1)x(2r+1) 칸 중 최소 차이 사용
  k: 3.0                  # 임계값 = max(k * sqrt(ref_var), min_thr)
  min_thr: 8.0            # 최소 임계값 (OpenCV 8비트 Lab 단위)

dirt_map:
  p_hit: 0.7
  p_miss: 0.4
  l_min: -2.0
  l_max: 3.5
  suspect_p: 0.7          # 이 확률 이상이면 "오염 의심"
  min_observations: 2     # 이보다 적게 본 칸은 "확인 불가" (hit 1번만으로 p=0.7이 되는 것 방지)
  min_region_area: 0.0004 # m^2 (2 cm x 2 cm) 미만 구역 제거

exclusion:                # [3] 비교에서 뺄 영역 (물체·로봇 몸체·바닥 아닌 곳)
  lidar_radius: 0.05      # LiDAR 점 주변 제외 반경 [m]
  lidar_shadow: 0.30      # LiDAR 점 뒤쪽(그림자)도 이 길이까지 제외 [m]. 카메라가 보는 물체 윗면이 투영되는 곳
  lidar_origin: [-0.064, 0.0]   # base_footprint 기준 LiDAR 위치 (Waffle Pi base_scan). 실제 TF로 확인
  body_polygon_px: []     # 화면에 찍히는 로봇 몸체 다각형 (왜곡 보정된 이미지 픽셀, [[u, v], ...]). 장착 후 측정
  use_segnet: true        # segNet으로 바닥이 아닌 픽셀 제외 (젯슨 전용)
  segnet_model: fcn-resnet18-sun-640x512
  segnet_floor_keyword: floor   # 클래스 이름으로 바닥 클래스를 찾는다 (번호 하드코딩 금지)
  use_detectnet: true     # detectNet 박스 제외 (젯슨 전용)
  detectnet_model: ssd-mobilenet-v2
  detectnet_threshold: 0.5
  detectnet_classes: [person, chair, backpack, handbag, suitcase]
  detectnet_margin_px: 10 # 박스를 사방으로 넓혀서 제외 [px]

revisit:
  n_shots: 5
  restore_ratio: 0.9
  standoff: 0.35          # 구역 중심이 로봇 전방 이 거리에 오도록 정지

viz:
  update_interval_s: 2.0

debug:
  output: none            # none | file | rtsp (rtsp는 젯슨 전용)
  every_n: 10             # file 모드: N프레임마다 저장
  rtsp_url: "rtsp://@:8554/debug"
